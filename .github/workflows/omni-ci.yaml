name: PR2635 H100 Compatibility Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, h100]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: [A, D]
    container:
      image: hongccc/sglang-omni@sha256:ebe4239e29a764ee3a2806385c061c5fd438a26f01458e503d3822dcba5790df
      options: >-
        --rm -e NVIDIA_VISIBLE_DEVICES -e OMNI_CI_CPUSET
        --cap-add=SYS_PTRACE -v /dev/shm:/dev/shm
        -v /data/omni-ci:/data/omni-ci
        -v /data/cache/huggingface:/github/home/.cache/huggingface
        -v /data/cache/huggingface:/root/.cache/huggingface
    env:
      OMNI_CI_HOME: /data/omni-ci/run-${{ github.run_id }}-${{ matrix.version }}
      OMNI_CI_MODEL: minicpmo
      PYTORCH_ALLOC_CONF: expandable_segments:True
      NCCL_NVLS_ENABLE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'A' && '615ddc21cb1bcc4f0017fa4f27a654bcb5a1ae42' || github.sha }}
      - uses: ./.github/actions/omni-setup
        with:
          venv-name: omni
          install-deps: "true"
      - name: Build Existing CI Router
        run: bash .github/scripts/prepare_rust_router.sh build
      - name: Freeze Model and Dataset Evidence
        shell: bash
        run: |
          source omni/bin/activate
          mkdir -p evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download
          model_path = snapshot_download("openbmb/MiniCPM-o-4_5", revision="503e754207c94da6bb26850b4469f367c9ea3582")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SGLANG_OMNI_TEST_MINICPMO_MODEL={model_path}\n")
          manifests = {}
          for repo in ("zhaochenyang20/Video_AMME_ci", "zhaochenyang20/Video_MME_ci"):
              revision = HfApi().dataset_info(repo).sha
              directory = Path(snapshot_download(repo, repo_type="dataset", revision=revision))
              hashes = {str(path.relative_to(directory)): hashlib.sha256(path.read_bytes()).hexdigest() for path in directory.rglob("*") if path.is_file()}
              manifests[repo] = {"revision": revision, "hashes": hashes}
          Path("evidence/manifests.json").write_text(json.dumps({"model_revision": "503e754207c94da6bb26850b4469f367c9ea3582", "datasets": manifests}, indent=2))
          PY
          python -m pip freeze > evidence/pip-freeze.txt
          nvidia-smi --query-gpu=uuid,name,driver_version --format=csv > evidence/gpus.csv
          git rev-parse HEAD > evidence/commit.txt
          printenv OMNI_CI_CPUSET > evidence/cpu-affinity.txt
      - name: Run Original CI Tests
        shell: bash
        run: |
          source omni/bin/activate
          export PYTHONPATH=$PWD
          pytest tests/test_model/test_qwen3_omni_videoamme_ci.py \
            tests/test_model/test_qwen3_omni_videoamme_talker_tp2_ci.py \
            tests/test_model/test_qwen3_omni_videomme_talker_ci.py \
            -v -s --basetemp="$PWD/evidence/pytest" \
            --junitxml=evidence/junit.xml 2>&1 | tee evidence/pytest.log
          exit "${PIPESTATUS[0]}"
      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2635-h100-${{ matrix.version }}
          path: |
            evidence/*.json
            evidence/*.xml
            evidence/*.log
            evidence/*.txt
            evidence/*.csv
            evidence/pytest/**/videoamme_results.json
            evidence/pytest/**/videomme_results.json
            evidence/pytest/**/server.log
          retention-days: 30
